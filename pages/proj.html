<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/assets/style.css">
        <link rel="icon" href="/assets/img/logo.png" />
        <script src="https://kit.fontawesome.com/605876b4c1.js" crossorigin="anonymous"></script>
        <title>Batchily — Projets</title>
    </head>

<body>
    <script src="/assets/components.js"></script>

    <section class="proj pro1j">
        <div class="procon">
            <div class="p-sec" id="projects-grid"></div>
        </div>
    </section>

    <script>
        fetch('/assets/projects.json')
            .then(r => r.json())
            .then(projects => {
                const grid = document.getElementById('projects-grid');
                projects.forEach(p => {
                    grid.innerHTML += `
                        <a href="/pages/projet.html?id=${p.id}">
                            <div class="p-cont ${p.cardClass}">
                                <div class="p-cont-text">
                                    <h2>${p.title}</h2>
                                    <p>${p.subtitle}</p>
                                </div>
                            </div>
                        </a>`;
                });
            });
    </script>
</body>
</html>
