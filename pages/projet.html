<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/assets/style.css">
        <link rel="icon" href="/assets/img/logo.png" />
        <script src="https://kit.fontawesome.com/605876b4c1.js" crossorigin="anonymous"></script>
        <title>Batchily</title>
        <meta name="description" content="">
        <meta property="og:type" content="article">
        <meta property="og:url" content="">
        <meta property="og:title" content="">
        <meta property="og:description" content="">
        <meta property="og:image" content="">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="">
        <meta name="twitter:description" content="">
        <meta name="twitter:image" content="">
    </head>

<body>
    <script src="/assets/components.js"></script>

    <section class="grid" id="project-grid"></section>

    <section class="props" id="project-props">
        <div class="prop">
            <p id="project-description" style="font-size:17px"></p>
            <div id="project-links" style="display:flex;justify-content:center;gap:10px;"></div>
        </div>
        <div class="image1">
            <img id="project-main-image" src="" alt="">
        </div>
    </section>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Visionneuse de photos">
        <button class="lightbox__close" id="lb-close" aria-label="Fermer"><i class="fas fa-times"></i></button>
        <button class="lightbox__arrow lightbox__arrow--prev" id="lb-prev" aria-label="Photo précédente"><i class="fas fa-chevron-left"></i></button>
        <div class="lightbox__img-wrap">
            <img id="lb-img" src="" alt="">
        </div>
        <button class="lightbox__arrow lightbox__arrow--next" id="lb-next" aria-label="Photo suivante"><i class="fas fa-chevron-right"></i></button>
        <div class="lightbox__counter" id="lb-counter"></div>
    </div>

    <script>
        const id = parseInt(new URLSearchParams(window.location.search).get('id'));
        let lbImages = [];
        let lbIndex = 0;

        fetch('/assets/projects.json')
            .then(r => r.json())
            .then(projects => {
                const p = projects.find(x => x.id === id);
                if (!p) { document.title = 'Projet introuvable'; return; }

                document.title = 'Batchily — ' + p.title;

                const pageUrl = 'https://www.batchily.com/pages/projet.html?id=' + p.id;
                const ogImage = p.mainImage
                    ? 'https://www.batchily.com' + p.mainImage
                    : 'https://www.batchily.com/assets/img/logo.png';
                const desc = p.subtitle || p.description.slice(0, 140);

                document.querySelector('meta[name="description"]').content = desc;
                document.querySelector('meta[property="og:url"]').content = pageUrl;
                document.querySelector('meta[property="og:title"]').content = 'Batchily — ' + p.title;
                document.querySelector('meta[property="og:description"]').content = desc;
                document.querySelector('meta[property="og:image"]').content = ogImage;
                document.querySelector('meta[name="twitter:title"]').content = 'Batchily — ' + p.title;
                document.querySelector('meta[name="twitter:description"]').content = desc;
                document.querySelector('meta[name="twitter:image"]').content = ogImage;

                const grid = document.getElementById('project-grid');
                lbImages = p.gridImages;

                p.gridImages.forEach((src, i) => {
                    const div = document.createElement('div');
                    div.className = 'grid-items';
                    const img = document.createElement('img');
                    img.src = src;
                    img.alt = p.title;
                    img.style.cursor = 'pointer';
                    img.addEventListener('click', () => openLightbox(i));
                    div.appendChild(img);
                    grid.appendChild(div);
                });
                if (p.gridImages.length === 0) grid.style.display = 'none';

                document.getElementById('project-description').textContent = p.description;

                const mainImg = document.getElementById('project-main-image');
                mainImg.src = p.mainImage;
                mainImg.alt = p.title;

                const linksDiv = document.getElementById('project-links');
                p.links.forEach(link => {
                    const a = document.createElement('a');
                    a.href = link.url;
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                    const btn = document.createElement('button');
                    btn.textContent = link.label;
                    a.appendChild(btn);
                    linksDiv.appendChild(a);
                });
            });

        // ── Lightbox logic ──────────────────────────────────────
        const lb      = document.getElementById('lightbox');
        const lbImg   = document.getElementById('lb-img');
        const lbCnt   = document.getElementById('lb-counter');

        function openLightbox(index) {
            lbIndex = index;
            lbImg.src = lbImages[lbIndex];
            lbCnt.textContent = (lbIndex + 1) + ' / ' + lbImages.length;
            lb.classList.add('lightbox--active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lb.classList.remove('lightbox--active');
            document.body.style.overflow = '';
        }

        function showPrev() {
            lbIndex = (lbIndex - 1 + lbImages.length) % lbImages.length;
            lbImg.src = lbImages[lbIndex];
            lbCnt.textContent = (lbIndex + 1) + ' / ' + lbImages.length;
        }

        function showNext() {
            lbIndex = (lbIndex + 1) % lbImages.length;
            lbImg.src = lbImages[lbIndex];
            lbCnt.textContent = (lbIndex + 1) + ' / ' + lbImages.length;
        }

        document.getElementById('lb-close').addEventListener('click', closeLightbox);
        document.getElementById('lb-prev').addEventListener('click', showPrev);
        document.getElementById('lb-next').addEventListener('click', showNext);

        lb.addEventListener('click', function(e) {
            if (e.target === lb) closeLightbox();
        });

        document.addEventListener('keydown', function(e) {
            if (!lb.classList.contains('lightbox--active')) return;
            if (e.key === 'Escape')      closeLightbox();
            if (e.key === 'ArrowLeft')   showPrev();
            if (e.key === 'ArrowRight')  showNext();
        });
    </script>
</body>
</html>
